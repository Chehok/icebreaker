<head>

  <style>
    :root {
      --bg1: #6a11cb;
      --bg2: #2575fc;
      --card: rgba(255, 255, 255, 0.95);
      --accent: #6a11cb;
      --text: #2b2b3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    h1 {
      color: #fff;
      font-size: 2rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    body {
      transition: background 0.5s ease;
    }

    body.spicy-mode {
      --bg1: #c31432;
      --bg2: #f45c43;
      --accent: #c31432;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .spices {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 18px;
    }

    .spice-btn {
      flex: 1;
      max-width: 160px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    .spice-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .spice-btn.active {
      background: #fff;
      color: var(--accent);
      border-color: #fff;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 50px;
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .chip.active {
      background: #fff;
      color: var(--accent);
      border-color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 32px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: none;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: #fff;
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge.show {
      display: inline-block;
    }

    .question {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .question.placeholder {
      color: #9a9ab0;
      font-weight: 500;
      font-size: 1.15rem;
    }

    .question.pop {
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(0.9) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .btn {
      background: #fff;
      color: var(--accent);
      border: none;
      border-radius: 50px;
      padding: 18px 40px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-family: inherit;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .counter {
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
    }
  </style>
</head>

    const questions = [
      ...mildQuestions.map((q) => ({ ...q, spice: "mild" })),
      ...spicyQuestions.map((q) => ({ ...q, spice: "spicy" }))
    ];

    const spices = {
      mild: { label: "😋 순한맛" },
      spicy: { label: "🌶️ 매운맛" }
    };

    const questionEl = document.getElementById("question");
    const badgeEl = document.getElementById("badge");
    const btn = document.getElementById("pickBtn");
    const counterEl = document.getElementById("counter");
    const categoriesEl = document.getElementById("categories");
    const spicesEl = document.getElementById("spices");

    let currentSpice = "mild";
    let currentCategory = "all";
    let lastText = "";

    Object.entries(spices).forEach(([key, { label }]) => {
      const btnEl = document.createElement("button");
      btnEl.className = "spice-btn" + (key === currentSpice ? " active" : "");
      btnEl.dataset.spice = key;
      btnEl.textContent = label;
      btnEl.addEventListener("click", () => selectSpice(key));
      spicesEl.appendChild(btnEl);
    });

    const chipDefs = [{ key: "all", label: "✨ 전체" }].concat(
      Object.entries(categories).map(([key, { label }]) => ({ key, label }))
    );

    chipDefs.forEach(({ key, label }) => {
      const chip = document.createElement("button");
      chip.className = "chip" + (key === "all" ? " active" : "");
      chip.textContent = label;
      chip.dataset.key = key;
      chip.addEventListener("click", () => selectCategory(key));
      categoriesEl.appendChild(chip);
    });

    function getPool() {
      return questions.filter(
        (q) =>
          q.spice === currentSpice &&
          (currentCategory === "all" || q.category === currentCategory)
      );
    }

    function updateCounter() {
      const count = getPool().length;
      const spiceName = spices[currentSpice].label;
      const catName = currentCategory === "all" ? "전체" : categories[currentCategory].label;
      counterEl.textContent = `${spiceName} · ${catName} · 질문 ${count}개`;
    }

    function selectSpice(key) {
      currentSpice = key;
      document.querySelectorAll(".spice-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.spice === key);
      });
      document.body.classList.toggle("spicy-mode", key === "spicy");
      updateCounter();
    }

    function selectCategory(key) {
      currentCategory = key;
      document.querySelectorAll(".chip").forEach((c) => {
        c.classList.toggle("active", c.dataset.key === key);
      });
      updateCounter();
    }

    function pickQuestion() {
      const pool = getPool();
      let item;
      do {
        item = pool[Math.floor(Math.random() * pool.length)];
      } while (item.text === lastText && pool.length > 1);
      lastText = item.text;

      badgeEl.textContent = `${spices[item.spice].label} · ${categories[item.category].label}`;
      badgeEl.classList.add("show");

      questionEl.classList.remove("placeholder", "pop");
      void questionEl.offsetWidth;
      questionEl.textContent = item.text;
      questionEl.classList.add("pop");
    }

    btn.addEventListener("click", pickQuestion);
    updateCounter();

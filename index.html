<body data-mode="topic">
  <button class="chip install-btn" id="installBtn" type="button" hidden>홈 화면에 추가</button>
  <main class="container">
    <h1>🧊 Icebreaker</h1>
    <p class="subtitle">무슨 얘기부터 할지 막막할 때, 랜덤 질문으로 대화를 시작해 보세요.<br />맛과 카테고리를 고르고 돌아가며 답해 봐요.</p>

    <p class="subtitle">답하기 곤란하면 언제든 건너뛰세요. 실명이나 타인의 비밀은 말하지 않아도 돼요.</p>

    <nav class="modes" aria-label="게임 모드">
      <a class="mode-btn" href="./index.html" aria-current="page">💬 대화 주제</a>
      <a class="mode-btn" href="./balance.html">⚖️ 밸런스게임</a>
      <a class="mode-btn" href="./who.html">🎯 이 중 누가?</a>
    </nav>
    <div class="spices" id="spices" role="group" aria-label="맛 선택"></div>
    <div class="categories" id="categories" role="group" aria-label="카테고리 선택"></div>

    <div class="card" id="card">
      <span class="badge" id="badge"></span>
      <p class="question placeholder" id="question"></p>
      <div class="versus" id="versus"></div>
      <p class="who-hint" id="whoHint">👉 참여하고 싶은 사람끼리, 하나 둘 셋에 가리켜 주세요!</p>
    </div>

    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="btn" id="pickBtn"></button>
    <p class="counter" id="counter"></p>
    <div data-ad-slot aria-label="광고" hidden></div>
  </main>

  <dialog class="install-guide" id="installGuide" aria-labelledby="installGuideTitle" aria-describedby="installGuideText">
    <h2 id="installGuideTitle">홈 화면에 추가</h2>
    <p id="installGuideText">Safari에서 공유 → 홈 화면에 추가를 선택해 주세요.</p>
    <form method="dialog"><button class="chip" type="submit" autofocus>닫기</button></form>
  </dialog>

<script data-goatcounter="https://icebreaker.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>

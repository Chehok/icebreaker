<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🧊</text></svg>">
  <title>Icebreaker</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f4f5f9" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Icebreaker" />
  <meta name="description" content="모임 분위기를 풀어주는 대화 주제, 밸런스 게임, 이 중 누가? 모음, Icebreaker" />
  <style>
    :root {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface-2: #f7f8fb;
      --line: #e4e6ee;
      --line-strong: #d3d6e2;
      --text: #171923;
      --text-2: #3f4354;
      --muted: #606579;
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --accent-soft: #eef0ff;
      --accent-ink: #3730a3;
      --accent-glow: rgba(79, 70, 229, 0.16);
      --radius: 22px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 30px -10px rgba(16, 24, 40, 0.14);
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    body.spicy-mode {
      --accent: #d6303b;
      --accent-strong: #b9242e;
      --accent-soft: #fff0ef;
      --accent-ink: #a8201f;
      --accent-glow: rgba(214, 48, 59, 0.15);
    }

    body.hot-mode {
      --accent: #c2410c;
      --accent-strong: #9a3412;
      --accent-soft: #fff1e8;
      --accent-ink: #9a1c0c;
      --accent-glow: rgba(234, 88, 12, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(1000px 520px at 50% -160px, var(--accent-glow), transparent 72%);
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      word-break: keep-all;
      transition: background-color 0.4s ease;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      color: var(--text);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
      line-height: 1.65;
      letter-spacing: -0.01em;
    }

    /* ---------- mode switch (segmented control) ---------- */
    .modes {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin: 0 auto 14px;
      max-width: 380px;
      background: #e9ebf2;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 10px;
      padding: 11px 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .mode-btn:hover {
      color: var(--text);
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 2px 8px rgba(16, 24, 40, 0.06);
    }

    .modes { max-width: 440px; }
    .mode-btn { white-space: normal; min-width: 0; overflow-wrap: anywhere; }
    @media (max-width: 420px) {
      .mode-btn { padding: 10px 4px; font-size: 0.84rem; letter-spacing: -0.03em; }
    }

    /* ---------- who mode hint ---------- */
    .who-hint {
      display: none;
      margin: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: #eef0ff;
      color: #4f46e5;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .who-hint.show { display: inline-block; }
    body.hot-mode .who-hint { background: #ffe9e0; color: #b42318; }
    body.spicy-mode .who-hint { background: #fff0f0; color: #dc2626; }

    /* ---------- spice toggle ---------- */
    .spices {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 22px;
    }

    .spice-btn {
      flex: 1;
      max-width: 130px;
      min-width: 0;
      white-space: nowrap;
      background: var(--surface);
      color: var(--text-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
      box-shadow: var(--shadow-sm);
    }

    .spice-btn:hover {
      border-color: var(--line-strong);
      color: var(--text);
    }

    .spice-btn.active {
      background: var(--accent-soft);
      color: var(--accent-ink);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* ---------- category chips ---------- */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .chip {
      background: var(--surface);
      color: var(--text-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
      font-family: inherit;
    }

    .chip:hover {
      border-color: var(--line-strong);
      background: var(--surface-2);
      color: var(--text);
    }

    .chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* ---------- question card ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 52px 36px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      transition: background 0.3s ease;
    }

    .badge {
      display: none;
      background: var(--accent-soft);
      color: var(--accent-ink);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .badge.show {
      display: inline-block;
    }

    .question {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.5;
      letter-spacing: -0.025em;
      color: var(--text);
      max-width: 30ch;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .question.placeholder {
      color: var(--muted);
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .question.pop {
      animation: pop 0.38s var(--ease);
    }

    @keyframes pop {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ---------- primary button ---------- */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      min-width: 220px;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1), 0 8px 20px -6px var(--accent);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1), 0 12px 26px -8px var(--accent);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .counter {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- focus ---------- */
    .mode-btn:focus-visible,
    .spice-btn:focus-visible,
    .chip:focus-visible,
    .option:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- balance game card ---------- */
    .card.balance {
      padding: 40px 28px 32px;
    }

    .versus {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .versus.show {
      display: flex;
    }

    .versus.pop {
      animation: pop 0.38s var(--ease);
    }

    .option {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 112px;
      padding: 20px 18px;
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--line);
      border-radius: 18px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -0.02em;
      word-break: keep-all;
      cursor: pointer;
      transition: transform 0.18s var(--ease), background 0.2s ease, color 0.2s ease,
        border-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .option:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: var(--shadow-md);
    }

    .option .opt-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-ink);
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .versus.has-choice .option:not(.chosen) {
      opacity: 1;
    }

    .versus.has-choice .option:not(.chosen):hover {
      opacity: 1;
    }

    .option.chosen {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1), 0 12px 28px -10px var(--accent);
    }

    .option.chosen .opt-tag {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .vs {
      align-self: center;
      flex: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      z-index: 1;
    }

    @media (min-width: 560px) {
      .versus {
        flex-direction: row;
        align-items: stretch;
        gap: 0;
      }
      .vs {
        align-self: center;
        margin: 0 -12px;
      }
      .option {
        min-height: 160px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 28px 16px;
        align-items: flex-start;
      }
      h1 {
        font-size: 1.65rem;
      }
      .subtitle {
        font-size: 0.88rem;
        margin-bottom: 22px;
      }
      .chip {
        padding: 6px 11px;
        font-size: 0.8rem;
      }
      .card {
        padding: 40px 22px;
        min-height: 210px;
      }
      .card.balance {
        padding: 32px 16px 18px;
      }
      .question {
        font-size: 1.28rem;
      }
      .option {
        min-height: 96px;
        font-size: 1.04rem;
      }
      .vs {
        margin: -16px 0;
      }
      .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .btn:hover,
      .option:hover,
      .option.chosen {
        transform: none;
      }
    }
    .question, .option, .badge, .who-hint { max-width: 100%; overflow-wrap: anywhere; }
    .option { min-width: 0; }
    .btn { min-width: 0; max-width: 100%; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧊 Icebreaker</h1>
    <p class="subtitle">대화 주제, 밸런스 게임, 이 중 누가?로 어색한 분위기를 풀어보세요!<br />모드와 맛, 카테고리를 고르고 버튼을 눌러봐요.</p>

    <p class="subtitle">답하기 곤란하면 언제든 건너뛰세요. 실명이나 타인의 비밀은 말하지 않아도 돼요.</p>

    <div class="modes" id="modes" role="group" aria-label="모드 선택"></div>
    <div class="spices" id="spices" role="group" aria-label="맛 선택"></div>
    <div class="categories" id="categories" role="group" aria-label="카테고리 선택"></div>

    <div class="card" id="card">
      <span class="badge" id="badge"></span>
      <p class="question placeholder" id="question"></p>
      <div class="versus" id="versus"></div>
      <p class="who-hint" id="whoHint">👉 참여하고 싶은 사람끼리, 하나 둘 셋에 가리켜 주세요!</p>
    </div>

    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
    <button class="btn" id="pickBtn"></button>
    <p class="counter" id="counter"></p>
  </div>

  <script>
    /* ===== 💬 대화 주제 모드 데이터 ===== */
    const categories = {
      imagine: { label: "🌈 상상 & 가정" },
      favorite: { label: "🍔 취향 & 최애" },
      daily: { label: "💬 나의 일상" },
      faith: { label: "✝️ 신앙 이야기" },
      love: { label: "💘 연애 & 썸" },
      tmi: { label: "👥 자기소개 & TMI" },
      hobby: { label: "🎮 덕질 & 취미" },
      deep: { label: "🥲 진지 토크" },
      travel: { label: "🌏 여행 & 버킷리스트" },
      food: { label: "🍽️ 먹부림 & 맛집" },
      memory: { label: "🕰️ 어린 시절 & 추억" },
      politics: { label: "🏛️ 정치 & 사회" },
      invest: { label: "📈 투자 & 돈" },
      work: { label: "💼 직장 & 학교" },
      content: { label: "📺 콘텐츠 & 드라마" },
      season: { label: "☀️ 날씨 & 계절" },
      place: { label: "🏘️ 동네 & 장소" },
      pet: { label: "🐶 반려동물 & 동물" },
      habit: { label: "⏰ 습관 & 루틴" },
      shop: { label: "🛍️ 쇼핑 & 소비" },
      school: { label: "🎒 학창시절" },
      silly: { label: "👽 만약에 & 엉뚱 질문" },
      thanks: { label: "💐 칭찬 & 고마움" }
    };

    const mildQuestions = [
      { text: "무인도에 딱 3가지만 가져갈 수 있다면?", category: "imagine" },
      { text: "타임머신이 생긴다면 과거와 미래 중 어디로 갈래?", category: "imagine" },
      { text: "로또 1등에 당첨되면 가장 먼저 하고 싶은 일은?", category: "imagine" },
      { text: "초능력 하나를 가질 수 있다면 어떤 능력?", category: "imagine" },
      { text: "만약 동물로 다시 태어난다면 어떤 동물이 되고 싶어?", category: "imagine" },
      { text: "하루 동안 다른 사람이 될 수 있다면 누가 되고 싶어?", category: "imagine" },
      { text: "휴대폰 없이 하루를 버틸 수 있을까?", category: "imagine" },
      { text: "만약 하루가 25시간이라면 그 1시간 뭐 할래?", category: "imagine" },
      { text: "10년 뒤 나는 어떤 모습일 것 같아?", category: "imagine" },

      { text: "인생 영화 딱 한 편만 꼽는다면?", category: "favorite" },
      { text: "죽기 전에 꼭 먹어보고 싶은 음식은?", category: "favorite" },
      { text: "최애 간식 or 야식은 뭐야?", category: "favorite" },
      { text: "무한 리필 가능한 음식 딱 하나 고른다면?", category: "favorite" },
      { text: "남들은 이해 못 하지만 내가 돈 안 아끼는 것은?", category: "favorite" },
      { text: "노래방 18번(애창곡)은 뭐야?", category: "favorite" },
      { text: "가장 가보고 싶은 콘서트나 공연은?", category: "favorite" },
      { text: "가장 좋아하는 이모지 하나만 고른다면?", category: "favorite" },
      { text: "지금 냉장고에 꼭 있어야 하는 음식은?", category: "favorite" },

      { text: "가장 최근에 크게 웃었던 순간은 언제였어?", category: "daily" },
      { text: "지금 당장 여행 갈 수 있다면 어디로?", category: "daily" },
      { text: "요즘 계속 미루고만 있는 '해야 하는 일'은?", category: "daily" },
      { text: "스트레스 받을 때 나만의 해소법이 있어?", category: "daily" },
      { text: "지금까지 받은 선물 중 최고는 뭐였어?", category: "daily" },
      { text: "친구들 사이에서 나의 별명 or 이미지는?", category: "daily" },
      { text: "요즘 가장 빠져 있는 취미나 관심사는?", category: "daily" },
      { text: "소소하지만 일상을 편하게 해준 물건은?", category: "daily" },
      { text: "인생에서 가장 잘한 선택은 뭐라고 생각해?", category: "daily" },
      { text: "비 오는 날 가장 하고 싶은 일은?", category: "daily" },
      { text: "다시 배우고 싶은 것이 있다면?", category: "daily" },
      { text: "오늘 하루를 색깔로 표현한다면 무슨 색?", category: "daily" },

      { text: "요즘 가장 감사한 일 한 가지는 뭐야?", category: "faith" },
      { text: "가장 좋아하는 성경 구절이나 마음에 남는 말씀은?", category: "faith" },
      { text: "요즘 기도하고 있는 제목이 있다면?", category: "faith" },

      { text: "이 중에 연봉을 제일 부풀려 말할 것 같은 사람은?", category: "work", spice: "hot" },
      { text: "이 중에 제일 먼저 부자가 돼서 우리를 모른 척할 것 같은 사람은?", category: "work", spice: "hot" },
      { text: "이 중에 사귄 사람이 제일 많을 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 어장 관리를 제일 잘할 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 전 애인이랑 다시 사귈 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 연애하면 질투가 제일 심할 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 친구의 전 애인과 사귈 수 있을 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 첫 데이트에서 키스까지 갈 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 고백받고 제일 많이 거절해 봤을 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 연인 폰을 몰래 볼 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 바람피우면 절대 안 들킬 것 같은 사람은?", category: "love", spice: "hot" },

      { text: "이 중에 지금 몰래 썸 타고 있을 것 같은 사람은?", category: "love", spice: "hot" },
      { text: "이 중에 스킨십 진도가 제일 빠를 것 같은 사람은?", category: "love", spice: "hot" },

      { text: "이 중에 술자리에서 제일 먼저 흑역사 만들 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 술 취하면 아무나 껴안을 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 이 모임 사람이랑 몰래 사귈 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 뒷담화를 제일 많이 할 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 비밀을 제일 빨리 퍼뜨릴 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 계산할 때 제일 먼저 사라질 것 같은 사람은?", category: "party", spice: "hot" },
      { text: "이 중에 연애 프로그램에 나가서 악마의 편집 당할 것 같은 사람은?", category: "future", spice: "hot" },
      { text: "이 중에 제일 먼저 결혼해서 제일 먼저 이혼 위기 올 것 같은 사람은?", category: "future", spice: "hot" },
      { text: "이 중에 나중에 연예인이랑 사귈 것 같은 사람은?", category: "future", spice: "hot" },
      { text: "이 중에 10년 후에 제일 많이 변해 있을 것 같은 사람은?", category: "future", spice: "hot" },
      { text: "이 중에 나이 들어서도 클럽 다닐 것 같은 사람은?", category: "future", spice: "hot" },
      { text: "이 중에 거울 보면서 자기한테 반할 것 같은 사람은?", category: "silly", spice: "hot" },
      { text: "이 중에 소개팅에서 제일 어이없는 이유로 차일 것 같은 사람은?", category: "silly", spice: "hot" },
      { text: "이 중에 잠꼬대로 짝사랑 이름 부를 것 같은 사람은?", category: "silly", spice: "hot" },
      { text: "이 중에 이 질문 걸릴까 봐 제일 쫄고 있는 사람은?", category: "silly", spice: "hot" },
      { text: "이 중에 오늘 집에 가서 이 대화 곱씹으며 이불킥 할 것 같은 사람은?", category: "silly", spice: "hot" }
    ];

    /* ===== 공통 설정 ===== */
    const spices = {
      mild: { label: "😋 순한맛" },
      medium: { label: "🌶️ 중간맛" },
      hot: { label: "🔥 매운맛" }
    };

    const modes = {
      topic: {
        label: "💬 대화 주제",
        categories,
        items: questions,
        placeholder: "아래 버튼을 눌러 질문을 뽑아보세요 👇",
        btnLabel: "질문 뽑기 🎯",
        unit: "질문"
      },
      balance: {
        label: "⚖️ 밸런스",
        categories: balanceCategories,
        items: balanceItems,
        placeholder: "아래 버튼을 눌러 밸런스 게임을 뽑아보세요 👇",
        btnLabel: "밸런스 뽑기 ⚖️",
        unit: "밸런스"
      },
      who: {
        label: "🎯 이 중 누가?",
        categories: whoCategories,
        items: whoItems,
        placeholder: "아래 버튼을 눌러 '이 중 누가?' 질문을 뽑아보세요 👇",
        btnLabel: "누구일까 뽑기 🎯",
        unit: "질문"
      }
    };

    const STORAGE_KEY = "icebreaker:mode";
    const SPICE_KEY = "icebreaker:spice";

    const announcementEl = document.getElementById("announcement");
    const cardEl = document.getElementById("card");
    const questionEl = document.getElementById("question");
    const versusEl = document.getElementById("versus");
    const badgeEl = document.getElementById("badge");
    const btn = document.getElementById("pickBtn");
    const counterEl = document.getElementById("counter");
    const categoriesEl = document.getElementById("categories");
    const spicesEl = document.getElementById("spices");
    const modesEl = document.getElementById("modes");
    const whoHintEl = document.getElementById("whoHint");

    let currentMode = "topic";
    let currentSpice = "mild";
    let currentCategory = "all";
    let lastKey = "";

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (Object.hasOwn(modes, saved)) currentMode = saved;
      let savedSpice = localStorage.getItem(SPICE_KEY);
      if (savedSpice === "spicy") {
        /* 예전 '매운맛(spicy)'은 지금의 중간맛으로 이전 */
        savedSpice = "medium";
        localStorage.setItem(SPICE_KEY, savedSpice);
      }
      if (Object.hasOwn(spices, savedSpice)) currentSpice = savedSpice;
    } catch (e) {
      /* localStorage 사용 불가 시 무시 */
    }

    const cur = () => modes[currentMode];
    const itemKey = (item) => (item.text !== undefined ? item.text : item.a + "||" + item.b);

    /* 모드 토글 */
    Object.entries(modes).forEach(([key, { label }]) => {
      const el = document.createElement("button");
      el.className = "mode-btn";
      el.dataset.mode = key;
      el.type = "button";
      el.textContent = label;
      el.addEventListener("click", () => selectMode(key));
      modesEl.appendChild(el);
    });

    /* 맛 버튼 */
    Object.entries(spices).forEach(([key, { label }]) => {
      const btnEl = document.createElement("button");
      btnEl.className = "spice-btn" + (key === currentSpice ? " active" : "");
      btnEl.dataset.spice = key;
      btnEl.type = "button";
      btnEl.textContent = label;
      btnEl.setAttribute("aria-pressed", key === currentSpice ? "true" : "false");
      btnEl.addEventListener("click", () => selectSpice(key));
      spicesEl.appendChild(btnEl);
    });

    function renderChips() {
      categoriesEl.innerHTML = "";
      const defs = [{ key: "all", label: "✨ 전체" }].concat(
        Object.entries(cur().categories).map(([key, { label }]) => ({ key, label }))
      );
      defs.forEach(({ key, label }) => {
        const chip = document.createElement("button");
        chip.className = "chip" + (key === currentCategory ? " active" : "");
        chip.type = "button";
        chip.textContent = label;
        chip.setAttribute("aria-pressed", key === currentCategory ? "true" : "false");
        chip.dataset.key = key;
        chip.addEventListener("click", () => selectCategory(key));
        categoriesEl.appendChild(chip);
      });
    }

    function getPool() {
      return cur().items.filter(
        (q) =>
          q.spice === currentSpice &&
          (currentCategory === "all" || q.category === currentCategory)
      );
    }

    function updateCounter() {
      const count = getPool().length;
      const spiceName = spices[currentSpice].label;
      const catName = currentCategory === "all" ? "전체" : cur().categories[currentCategory].label;
      counterEl.textContent = `${spiceName} · ${catName} · ${cur().unit} ${count}개`;
    }

    function showPlaceholder() {
      badgeEl.classList.remove("show");
      badgeEl.textContent = "";
      versusEl.classList.remove("show", "pop", "has-choice");
      versusEl.innerHTML = "";
      questionEl.style.display = "";
      questionEl.classList.remove("pop");
      questionEl.classList.add("placeholder");
      questionEl.textContent = cur().placeholder;
      announcementEl.textContent = "";
      whoHintEl.classList.remove("show");
    }

    function selectMode(key) {
      if (!Object.hasOwn(modes, key)) return;
      currentMode = key;
      currentCategory = "all";
      lastKey = "";
      try {
        localStorage.setItem(STORAGE_KEY, key);
      } catch (e) {
        /* 무시 */
      }
      document.querySelectorAll(".mode-btn").forEach((b) => {
        const on = b.dataset.mode === key;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      cardEl.classList.toggle("balance", key === "balance");
      btn.textContent = cur().btnLabel;
      renderChips();
      showPlaceholder();
      updateCounter();
    }

    function selectSpice(key) {
      if (!Object.hasOwn(spices, key)) return;
      currentSpice = key;
      try {
        localStorage.setItem(SPICE_KEY, key);
      } catch (e) {
        /* 무시 */
      }
      document.querySelectorAll(".spice-btn").forEach((b) => {
        const on = b.dataset.spice === key;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", String(on));
      });
      document.body.classList.toggle("spicy-mode", key === "medium");
      document.body.classList.toggle("hot-mode", key === "hot");
      showPlaceholder();
      updateCounter();
    }

    function selectCategory(key) {
      if (key !== "all" && !Object.hasOwn(cur().categories, key)) return;
      currentCategory = key;
      document.querySelectorAll(".chip").forEach((c) => {
        const on = c.dataset.key === key;
        c.classList.toggle("active", on);
        c.setAttribute("aria-pressed", String(on));
      });
      showPlaceholder();
      updateCounter();
    }

    function showTopic(item) {
      versusEl.classList.remove("show", "pop", "has-choice");
      versusEl.innerHTML = "";
      questionEl.style.display = "";
      questionEl.classList.remove("placeholder", "pop");
      void questionEl.offsetWidth;
      questionEl.textContent = item.text;
      questionEl.classList.add("pop");
      if (currentMode === "who") whoHintEl.classList.add("show");
    }

    function chooseOption(btnEl) {
      versusEl.querySelectorAll(".option").forEach((o) => {
        const on = o === btnEl;
        o.classList.toggle("chosen", on);
        o.setAttribute("aria-pressed", on ? "true" : "false");
      });
      versusEl.classList.add("has-choice");
    }

    function showBalance(item) {
      questionEl.style.display = "none";
      questionEl.classList.remove("pop");
      versusEl.innerHTML = "";
      versusEl.classList.remove("show", "pop", "has-choice");

      [["A", item.a], ["B", item.b]].forEach(([tag, text], i) => {
        if (i === 1) {
          const vs = document.createElement("div");
          vs.className = "vs";
          vs.setAttribute("aria-hidden", "true");
          vs.textContent = "VS";
          versusEl.appendChild(vs);
        }
        const opt = document.createElement("button");
        opt.type = "button";
        opt.className = "option";
        opt.setAttribute("aria-pressed", "false");
        const tagEl = document.createElement("span");
        tagEl.className = "opt-tag";
        tagEl.textContent = tag;
        const textEl = document.createElement("span");
        textEl.textContent = text;
        opt.appendChild(tagEl);
        opt.appendChild(textEl);
        opt.addEventListener("click", () => chooseOption(opt));
        versusEl.appendChild(opt);
      });

      void versusEl.offsetWidth;
      versusEl.classList.add("show", "pop");
    }

    function pickQuestion() {
      const pool = getPool();
      if (!pool.length) {
        showPlaceholder();
        questionEl.textContent = "이 조건에 맞는 질문이 없어요. 다른 맛이나 카테고리를 골라주세요.";
        announcementEl.textContent = questionEl.textContent;
        return;
      }
      const alternatives = pool.filter((candidate) => itemKey(candidate) !== lastKey);
      const candidates = alternatives.length ? alternatives : pool;
      const item = candidates[Math.floor(Math.random() * candidates.length)];
      lastKey = itemKey(item);

      badgeEl.textContent = `${spices[item.spice].label} · ${cur().categories[item.category].label}`;
      badgeEl.classList.add("show");

      if (currentMode === "balance") showBalance(item);
      else showTopic(item);
      announcementEl.textContent = `${badgeEl.textContent}. ${currentMode === "balance" ? `A: ${item.a}. B: ${item.b}` : item.text}`;
    }

    btn.addEventListener("click", pickQuestion);
    selectMode(currentMode);
    selectSpice(currentSpice);

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {
        /* 오프라인 첫 방문·등록 제한 환경에서도 질문 뽑기는 계속 동작합니다. */
      });
    }

  </script>
</body>
